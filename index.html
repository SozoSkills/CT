
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Teacher's Attendance & Demographics Tracker</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <h1>Class Tracker</h1>
    
    <div class="add-student">
      <h2>Add New Student</h2>
      <form id="studentForm">
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <select id="race" required>
          <option value="">Select Race</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="coloured">Coloured</option>
        </select>
        <select id="class" required>
          <option value="">Select Class</option>
          <option value="barista">Barista</option>
          <option value="baking">Baking</option>
          <option value="beauty">Beauty</option>
          <option value="hair">Hair</option>
        </select>
        <select id="session" required>
          <option value="">Select Session</option>
          <option value="morning">Morning Class</option>
          <option value="afternoon">Afternoon Class</option>
        </select>
        <button type="submit">Add Student</button>
      </form>
    </div>

    <div class="attendance-section">
      <h2>Attendance</h2>
      <div id="dateSelect">
        <input type="date" id="attendanceDate">
        <select id="classFilter" onchange="renderAttendance()">
          <option value="">All Classes</option>
          <option value="barista">Barista</option>
          <option value="baking">Baking</option>
          <option value="beauty">Beauty</option>
          <option value="hair">Hair</option>
        </select>
      </div>
      <div id="attendanceList"></div>
    </div>

    <div class="student-list">
      <h2>Student List</h2>
      <div class="search-bar">
        <input type="text" id="searchStudent" placeholder="Search students...">
      </div>
      <div class="sort-controls">
        <select id="sortBy">
          <option value="name">Sort by Name</option>
          <option value="age">Sort by Age</option>
        </select>
        <select id="sortOrder">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
        <select id="sessionFilter" onchange="searchAndSortStudents()">
          <option value="">All Sessions</option>
          <option value="morning">Morning Class</option>
          <option value="afternoon">Afternoon Class</option>
        </select>
      </div>
      <div id="studentList"></div>
    </div>

    <div class="demographics-section">
      <h2>Demographics Report</h2>
      <div id="demographicsReport"></div>
      <button onclick="exportReport()" class="export-btn">Export Report</button>
    </div>

    <div class="attendance-monitoring-section">
      <h2>Attendance Monitoring</h2>
      <select id="monitoringClassFilter" onchange="filterAttendanceMonitoring()">
        <option value="">All Classes</option>
        <option value="barista">Barista</option>
        <option value="baking">Baking</option>
        <option value="beauty">Beauty</option>
        <option value="hair">Hair</option>
      </select>
      <div id="attendanceMonitoringList"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
